name: Browser tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install Lightpanda
        run: |
          mkdir -p "$RUNNER_TEMP/lightpanda"
          curl -fsSL -o "$RUNNER_TEMP/lightpanda/lightpanda" https://github.com/lightpanda-io/browser/releases/download/1.0.2/lightpanda-x86_64-linux
          chmod +x "$RUNNER_TEMP/lightpanda/lightpanda"
          echo "LIGHTPANDA_PATH=$RUNNER_TEMP/lightpanda/lightpanda" >> "$GITHUB_ENV"
      - name: Click through the admin
        run: bundle exec rake test:browser
